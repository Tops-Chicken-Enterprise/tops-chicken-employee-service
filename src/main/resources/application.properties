spring.application.name=tops-chicken-employee-service
server.port=8081
server.servlet.context-path=/api/v1

# Native .env property loading
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# WSO2 Integration Properties
wso2.base-url=${WSO2_BASE_URL}
wso2.token-url=${WSO2_TOKEN_URL}
wso2.scim-users-url=${WSO2_SCIM_USERS_URL}
wso2.client-id=${WSO2_CLIENT_ID}
wso2.client-secret=${WSO2_CLIENT_SECRET}
wso2.ask-password-enabled=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.repositories.enabled=false